# Supabase local dev (`supabase start`) — รัน Postgres + Auth + Storage ในเครื่อง
#
# DDL ทั้งหมดเป็นของ Prisma ไม่ได้อยู่ในโฟลเดอร์นี้:
#   ตาราง        → lib/prisma/migrations/
#   RLS/trigger  → lib/prisma/sql/policies.sql
project_id = "notify-production"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/login"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false            # ผู้ใช้ถูกสร้างโดย super_admin ผ่าน POST /api/users เท่านั้น

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
