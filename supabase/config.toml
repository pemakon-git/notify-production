# Supabase local dev (`supabase start`) — รัน Postgres + Auth + Storage ในเครื่อง
#
# DDL ทั้งหมดเป็นของ Prisma ไม่ได้อยู่ในโฟลเดอร์นี้:
#   ตาราง        → lib/prisma/migrations/
#   RLS/trigger  → lib/prisma/sql/policies.sql
project_id = "notify-production"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:6001"
additional_redirect_urls = ["http://localhost:6001/login"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# ปิดการสมัครเองจากภายนอก — ผู้ใช้ถูกสร้างโดย super_admin ผ่าน POST /api/users เท่านั้น
# (admin API ข้อจำกัดนี้ไม่โดน)
enable_signup = false

[auth.email]
# ⚠️ ค่านี้ = "เปิด/ปิด provider อีเมลทั้งตัว" ไม่ใช่แค่การสมัครเอง
#    ตั้ง false เมื่อไหร่ → login ด้วยอีเมล/รหัสผ่านพังทันที (GoTrue ตอบ email_provider_disabled)
#    การกันสมัครเองทำที่ [auth] enable_signup ข้างบนแล้ว
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
